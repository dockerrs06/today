parameters:
  - name: branchName
    type: string

jobs:
  - job: BuildJob
    displayName: "Build (Validate + Export ARM)"
    steps:

      - checkout: self

      # -----------------------------
      # Branch info
      # -----------------------------
      - script: |
          echo "Branch detected: ${{ parameters.branchName }}"
          echo "##vso[task.setvariable variable=branchName]${{ parameters.branchName }}"
        displayName: "Fetch Branch details"

      # -----------------------------
      # Node install
      # -----------------------------
      - task: NodeTool@0
        inputs:
          versionSpec: '18.x'
        displayName: 'Install Node.js'

      # -----------------------------
      # npm install (package.json folder)
      # -----------------------------
      - task: Npm@1
        inputs:
          command: 'install'
          workingDir: '$(Build.SourcesDirectory)'
          verbose: true
        displayName: 'Install npm packages'

      # -----------------------------
      # ADF Validate
      # -----------------------------
      - task: Npm@1
        displayName: 'ADF Validate'
        inputs:
          command: 'custom'
          workingDir: '$(Build.SourcesDirectory)'
          customCommand: >
            run build validate
            $(Build.SourcesDirectory)
            /subscriptions/$(devSubscriptionId)/resourceGroups/$(devResourceGroup)/providers/Microsoft.DataFactory/factories/$(datafactory_dev)

      # -----------------------------
      # ADF Export ARM
      # -----------------------------
      - task: Npm@1
        displayName: 'ADF Export ARM'
        inputs:
          command: 'custom'
          workingDir: '$(Build.SourcesDirectory)'
          customCommand: >
            run build export
            $(Build.SourcesDirectory)
            /subscriptions/$(devSubscriptionId)/resourceGroups/$(devResourceGroup)/providers/Microsoft.DataFactory/factories/$(datafactory_dev)
            ArmTemplate

      # -----------------------------
      # Copy ARM output
      # -----------------------------
      - task: CopyFiles@2
        displayName: 'Copy ARM templates'
        inputs:
          SourceFolder: '$(Build.SourcesDirectory)/ArmTemplate'
          Contents: '**'
          TargetFolder: '$(Build.ArtifactStagingDirectory)/ArmTemplate'

      # -----------------------------
      # Copy Pre/Post deploy scripts
      # -----------------------------
      - task: CopyFiles@2
        displayName: 'Copy deployment scripts'
        inputs:
          SourceFolder: '$(Build.SourcesDirectory)/script'
          Contents: '**'
          TargetFolder: '$(Build.ArtifactStagingDirectory)/script'

      # -----------------------------
      # Publish artifact
      # -----------------------------
      - task: PublishBuildArtifacts@1
        displayName: 'Publish build artifact'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)'
          ArtifactName: 'drop'
          publishLocation: 'Container'





























